<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>節奏擊點小遊戲</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 14px;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: linear-gradient(160deg, #241640, #150c28);
    color: #f5f2ff;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 8px;
  }
  p {
    font-size: 12.5px;
    line-height: 1.6;
    color: #d9c9ff;
    margin: 0 0 8px;
  }
  ul {
    font-size: 12px;
    line-height: 1.6;
    color: #b7a6e0;
    padding-left: 18px;
    margin: 0;
  }
</style>
</head>
<body>
  <h1>♪ 節奏擊點小遊戲</h1>
  <p>打開 music.youtube.com 播放任何一首歌，畫面右下角就會自動出現浮動面板。</p>
  <ul>
    <li>輸入 BPM 或用 Tap Tempo 跟拍</li>
    <li>按「開始」讓音符依拍速出現</li>
    <li>滑鼠/觸控點擊，或按 Z / X 擊發</li>
    <li>面板可拖曳、可最小化、可關閉</li>
  </ul>
</body>
</html>
