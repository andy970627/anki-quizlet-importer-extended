<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音符歌詞打擊遊戲</title>
<style>
  :root {
    --bg1: #1b1030;
    --bg2: #2d1b4e;
    --accent: #ff6fae;
    --accent2: #6fd8ff;
    --text: #f5f2ff;
    --panel: rgba(20, 10, 40, 0.72);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--text);
    padding: 16px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(111, 216, 255, 0.6);
  }
  .subtitle {
    margin: 0 0 12px;
    font-size: 0.85rem;
    color: #b7a6e0;
    letter-spacing: 1px;
  }
  #app {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    gap: 8px;
  }
  #hud .badge {
    background: var(--panel);
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #hud .badge.score { color: var(--accent); }
  #hud .badge.time { color: var(--accent2); }
  #hud .badge.combo { color: #ffd76f; }
  #muteBtn {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    color: var(--text);
    font-size: 1.1rem;
    padding: 6px 12px;
    cursor: pointer;
    line-height: 1;
  }
  #lyricTicker {
    width: 100%;
    max-width: 800px;
    text-align: center;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 1.05rem;
    color: #d9c9ff;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    min-height: 1.6em;
    letter-spacing: 0.5px;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  #gameCanvas {
    width: 100%;
    height: auto;
    display: block;
    background: linear-gradient(160deg, #241640, #150c28);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(255, 111, 174, 0.25);
    touch-action: none;
    cursor: crosshair;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10, 4, 24, 0.82);
    border-radius: 16px;
    padding: 20px;
    gap: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay p {
    margin: 0;
    max-width: 480px;
    line-height: 1.7;
    color: #d9c9ff;
    font-size: 0.95rem;
  }
  #overlay .result-score {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(255,111,174,0.7);
  }
  #overlay .result-combo {
    font-size: 1rem;
    color: #ffd76f;
  }
  button.game-btn {
    padding: 12px 32px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #1b1030;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(255, 111, 174, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(111, 216, 255, 0.55); }
  button.game-btn:active { transform: translateY(0); }
  footer {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #8b7fb0;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <h1>♪ 節奏歌詞打擊遊戲 ♪</h1>
  <div class="subtitle">歌曲：Twinkle Twinkle Little Star（經典英文兒歌，公共領域）</div>

  <div id="hud">
    <div class="badge score">分數：<span id="scoreVal">0</span></div>
    <div class="badge combo">連擊：<span id="comboVal">0</span></div>
    <div class="badge time">剩餘時間：<span id="timeVal">60</span> 秒</div>
    <button id="muteBtn" title="切換音樂">🔊</button>
  </div>

  <div id="lyricTicker">按下「開始遊戲」，音符將依照歌曲歌詞的正確順序出現！</div>

  <div id="gameWrap">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="overlay">
      <p>
        遊戲開始後會播放《Twinkle Twinkle Little Star》的旋律，<br>
        音符圓圈會依照歌詞在歌曲中出現的先後順序，依序浮現在畫面上。<br>
        請在音符圈縮小到定位時盡快點擊，點中即可得 1 分！<br>
        時間限制為 <strong>60 秒</strong>，時間到即結束並顯示總分。
      </p>
      <button class="game-btn" id="startBtn">開始遊戲</button>
    </div>
  </div>

  <footer>使用滑鼠或觸控點擊音符即可得分 · 純前端 HTML / CSS / JavaScript 製作</footer>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const muteBtn = document.getElementById("muteBtn");
  const scoreEl = document.getElementById("scoreVal");
  const comboEl = document.getElementById("comboVal");
  const timeEl = document.getElementById("timeVal");
  const lyricTicker = document.getElementById("lyricTicker");

  // ---------------------------------------------------------------------
  // 歌曲資料：《Twinkle Twinkle Little Star》（Jane Taylor, 1806 — 公共領域）
  // 每個音節對應旋律中的一個音符，音節將照歌曲原本的先後順序出現，
  // 並使用 Web Audio 依相同時間軸播放對應旋律，達到「跟著音樂依序出現」。
  // ---------------------------------------------------------------------
  const NOTE_FREQ = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.0, A: 440.0 };

  const SONG_LINES = [
    { text: "Twinkle, twinkle, little star,", notes: [["Twin", "C", 1], ["kle", "C", 1], ["Twin", "G", 1], ["kle", "G", 1], ["Lit", "A", 1], ["tle", "A", 1], ["Star", "G", 2]] },
    { text: "How I wonder what you are!", notes: [["How", "F", 1], ["I", "F", 1], ["Won", "E", 1], ["der", "E", 1], ["What", "D", 1], ["You", "D", 1], ["Are", "C", 2]] },
    { text: "Up above the world so high,", notes: [["Up", "G", 1], ["a", "G", 1], ["bove", "F", 1], ["the", "F", 1], ["world", "E", 1], ["so", "E", 1], ["high", "D", 2]] },
    { text: "Like a diamond in the sky.", notes: [["Like", "G", 1], ["a", "G", 1], ["dia", "F", 1], ["mond", "F", 1], ["in", "E", 1], ["the", "E", 1], ["sky", "D", 2]] },
    { text: "Twinkle, twinkle, little star,", notes: [["Twin", "C", 1], ["kle", "C", 1], ["Twin", "G", 1], ["kle", "G", 1], ["Lit", "A", 1], ["tle", "A", 1], ["Star", "G", 2]] },
    { text: "How I wonder what you are!", notes: [["How", "F", 1], ["I", "F", 1], ["Won", "E", 1], ["der", "E", 1], ["What", "D", 1], ["You", "D", 1], ["Are", "C", 2]] }
  ];

  const BEAT_MS = 450; // 每拍時長（節奏速度）

  // 攤平成單一序列，並記錄每個音符在歌曲中的累積起始時間（拍）
  const SONG_NOTES = [];
  (function buildSongNotes() {
    let beatCursor = 0;
    SONG_LINES.forEach((line, lineIndex) => {
      line.notes.forEach(([syllable, note, beats]) => {
        SONG_NOTES.push({ syllable, note, beats, lineIndex, startBeat: beatCursor, lineText: line.text });
        beatCursor += beats;
      });
    });
  })();
  const TOTAL_BEATS = SONG_NOTES.reduce((sum, n) => sum + n.beats, 0);
  const LOOP_MS = TOTAL_BEATS * BEAT_MS; // 一輪完整歌曲的長度（會反覆播放至 60 秒結束）

  const GAME_SECONDS = 60;
  const APPROACH_MS = 800;   // 音符圈縮小到定位所需時間
  const HIT_WINDOW_MS = 380; // 縮小到定位後，可點擊得分的寬容時間
  const MAX_TARGETS = 10;
  const BASE_RADIUS = 34;

  const COLORS = [
    ["#ff6fae", "#ff9ecb"],
    ["#6fd8ff", "#9ee9ff"],
    ["#ffd76f", "#ffe9a8"],
    ["#a6ff6f", "#c9ffa0"],
    ["#c88bff", "#e0bfff"]
  ];

  let state = "idle"; // idle | playing | ended
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let timeLeft = GAME_SECONDS;
  let targets = [];
  let popEffects = [];
  let rafId = null;
  let countdownId = null;

  // ---- Web Audio：即時合成的旋律播放 ----
  let audioCtx = null;
  let masterGain = null;
  let audioEnabled = true;
  let scheduledOscillators = [];
  let songStartAudioTime = 0; // AudioContext 時鐘上的歌曲起點（秒）
  let nextSpawnIndex = 0;     // 下一個要出現的音符（依序、累積索引）
  let currentLineIndex = -1;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function ensureAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = audioEnabled ? 1 : 0;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playNote(freq, startAt, durSec) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(0.2, startAt + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + durSec);
    osc.connect(gain).connect(masterGain);
    osc.start(startAt);
    osc.stop(startAt + durSec + 0.03);
    scheduledOscillators.push(osc);
  }

  function stopAllAudio() {
    scheduledOscillators.forEach((o) => {
      try { o.stop(); } catch (e) { /* 已停止則忽略 */ }
    });
    scheduledOscillators = [];
  }

  // 預先排程整首歌曲（含重複輪播）在 Web Audio 的精準時間軸上
  function scheduleSong(totalDurationMs) {
    const ctxNow = ensureAudioContext();
    const a0 = ctxNow.currentTime + 0.15; // 留一點緩衝時間再開始播放
    const loops = Math.ceil(totalDurationMs / LOOP_MS) + 1;
    for (let loop = 0; loop < loops; loop++) {
      for (const n of SONG_NOTES) {
        const noteStartMs = loop * LOOP_MS + n.startBeat * BEAT_MS;
        if (noteStartMs > totalDurationMs) continue;
        const startAt = a0 + noteStartMs / 1000;
        const durSec = (n.beats * BEAT_MS) / 1000 * 0.85;
        playNote(NOTE_FREQ[n.note], startAt, durSec);
      }
    }
    return a0;
  }

  function resetState() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    timeLeft = GAME_SECONDS;
    targets = [];
    popEffects = [];
    nextSpawnIndex = 0;
    currentLineIndex = -1;
    scoreEl.textContent = "0";
    comboEl.textContent = "0";
    timeEl.textContent = String(GAME_SECONDS);
    lyricTicker.textContent = SONG_LINES[0].text;
  }

  function absoluteStartMs(index) {
    const loop = Math.floor(index / SONG_NOTES.length);
    const note = SONG_NOTES[index % SONG_NOTES.length];
    return loop * LOOP_MS + note.startBeat * BEAT_MS;
  }

  function spawnTargetFromNote(note) {
    const r = BASE_RADIUS;
    const margin = r + 20;
    const x = rand(margin, W - margin);
    const y = rand(margin + 20, H - margin);
    const color = COLORS[note.lineIndex % COLORS.length];
    targets.push({
      x, y, r,
      char: note.syllable,
      color,
      spawnAt: performance.now(),
      hit: false
    });

    if (note.lineIndex !== currentLineIndex) {
      currentLineIndex = note.lineIndex;
      lyricTicker.textContent = note.lineText;
    }
  }

  function addPopEffect(x, y, text, color) {
    popEffects.push({ x, y, text, color, startAt: performance.now(), life: 650 });
  }

  function handleHit(target, now) {
    target.hit = true;
    score += 1;
    combo += 1;
    if (combo > maxCombo) maxCombo = combo;
    scoreEl.textContent = String(score);
    comboEl.textContent = String(combo);
    addPopEffect(target.x, target.y, "+1", target.color[0]);
  }

  function handleMiss(target) {
    combo = 0;
    comboEl.textContent = "0";
    addPopEffect(target.x, target.y, "MISS", "#888");
  }

  function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function onPointerDown(clientX, clientY) {
    if (state !== "playing") return;
    const { x, y } = pointerToCanvas(clientX, clientY);
    const now = performance.now();

    // 由最新出現的音符開始檢查，較符合直覺
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.hit) continue;
      const dx = x - t.x;
      const dy = y - t.y;
      if (Math.sqrt(dx * dx + dy * dy) <= t.r) {
        handleHit(t, now);
        return;
      }
    }
  }

  canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
  canvas.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      if (touch) onPointerDown(touch.clientX, touch.clientY);
    },
    { passive: false }
  );

  muteBtn.addEventListener("click", () => {
    audioEnabled = !audioEnabled;
    muteBtn.textContent = audioEnabled ? "🔊" : "🔇";
    if (masterGain) masterGain.gain.value = audioEnabled ? 1 : 0;
  });

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#5a4a80";
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= W; gx += 40) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }
    for (let gy = 0; gy <= H; gy += 40) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTarget(t, now) {
    const elapsed = now - t.spawnAt;
    const approachProgress = Math.min(elapsed / APPROACH_MS, 1);
    const outerR = t.r + (1 - approachProgress) * t.r * 2.2;

    // 外圈（縮小指示圈）
    ctx.beginPath();
    ctx.arc(t.x, t.y, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = t.color[1];
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 本體圓圈
    const grad = ctx.createRadialGradient(t.x, t.y, 4, t.x, t.y, t.r);
    grad.addColorStop(0, t.color[1]);
    grad.addColorStop(1, t.color[0]);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.stroke();

    // 歌詞音節文字
    ctx.fillStyle = "#1b1030";
    ctx.font = "bold 18px 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.char, t.x, t.y + 1);
  }

  function drawPopEffects(now) {
    popEffects = popEffects.filter((p) => now - p.startAt < p.life);
    for (const p of popEffects) {
      const t = (now - p.startAt) / p.life;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.font = "bold 20px 'Microsoft JhengHei', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y - t * 30 - 10);
      ctx.restore();
    }
  }

  function gameLoop() {
    if (state !== "playing") return;
    const now = performance.now();
    const elapsedAudioMs = (audioCtx.currentTime - songStartAudioTime) * 1000;

    // 依歌曲時間軸，依序（非隨機）讓輪到的音符出現
    while (elapsedAudioMs >= absoluteStartMs(nextSpawnIndex)) {
      spawnTargetFromNote(SONG_NOTES[nextSpawnIndex % SONG_NOTES.length]);
      nextSpawnIndex++;
    }

    // 移除逾時未點中的音符（記為 MISS）
    for (const t of targets) {
      if (!t.hit && now - t.spawnAt > APPROACH_MS + HIT_WINDOW_MS) {
        t.expired = true;
        handleMiss(t);
      }
    }
    targets = targets.filter((t) => !t.hit && !t.expired);

    drawBackground();
    for (const t of targets) drawTarget(t, now);
    drawPopEffects(now);

    rafId = requestAnimationFrame(gameLoop);
  }

  function startCountdown() {
    countdownId = setInterval(() => {
      timeLeft -= 1;
      timeEl.textContent = String(Math.max(timeLeft, 0));
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function startGame() {
    resetState();
    state = "playing";
    overlay.classList.add("hidden");

    stopAllAudio();
    songStartAudioTime = scheduleSong((GAME_SECONDS + 2) * 1000);

    startCountdown();
    rafId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    state = "ended";
    clearInterval(countdownId);
    if (rafId) cancelAnimationFrame(rafId);
    targets = [];
    drawBackground();

    overlay.innerHTML = `
      <p>時間到！這是你這回合的表現：</p>
      <div class="result-score">總分：${score} 分</div>
      <div class="result-combo">最高連擊：${maxCombo}</div>
      <button class="game-btn" id="restartBtn">重新開始</button>
    `;
    overlay.classList.remove("hidden");
    document.getElementById("restartBtn").addEventListener("click", startGame);
  }

  startBtn.addEventListener("click", startGame);

  // 初始畫面預覽
  drawBackground();
})();
</script>
</body>
</html>
