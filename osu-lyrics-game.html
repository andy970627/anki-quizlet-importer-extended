<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音符歌詞打擊遊戲</title>
<style>
  :root {
    --bg1: #1b1030;
    --bg2: #2d1b4e;
    --accent: #ff6fae;
    --accent2: #6fd8ff;
    --text: #f5f2ff;
    --panel: rgba(20, 10, 40, 0.72);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--text);
    padding: 16px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 1.6rem;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(111, 216, 255, 0.6);
  }
  #app {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #hud {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 1.1rem;
    font-weight: bold;
  }
  #hud .badge {
    background: var(--panel);
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #hud .badge.score { color: var(--accent); }
  #hud .badge.time { color: var(--accent2); }
  #hud .badge.combo { color: #ffd76f; }
  #lyricTicker {
    width: 100%;
    max-width: 800px;
    text-align: center;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 1rem;
    color: #d9c9ff;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    min-height: 1.6em;
    letter-spacing: 1px;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  #gameCanvas {
    width: 100%;
    height: auto;
    display: block;
    background: linear-gradient(160deg, #241640, #150c28);
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 0 30px rgba(255, 111, 174, 0.25);
    touch-action: none;
    cursor: crosshair;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10, 4, 24, 0.82);
    border-radius: 16px;
    padding: 20px;
    gap: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay p {
    margin: 0;
    max-width: 480px;
    line-height: 1.7;
    color: #d9c9ff;
    font-size: 0.95rem;
  }
  #overlay .result-score {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--accent);
    text-shadow: 0 0 16px rgba(255,111,174,0.7);
  }
  #overlay .result-combo {
    font-size: 1rem;
    color: #ffd76f;
  }
  button.game-btn {
    padding: 12px 32px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #1b1030;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(255, 111, 174, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(111, 216, 255, 0.55); }
  button.game-btn:active { transform: translateY(0); }
  footer {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #8b7fb0;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <h1>♪ 節奏歌詞打擊遊戲 ♪</h1>

  <div id="hud">
    <div class="badge score">分數：<span id="scoreVal">0</span></div>
    <div class="badge combo">連擊：<span id="comboVal">0</span></div>
    <div class="badge time">剩餘時間：<span id="timeVal">60</span> 秒</div>
  </div>

  <div id="lyricTicker">按下「開始遊戲」，跟著歌詞節奏點擊出現的音符吧！</div>

  <div id="gameWrap">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="overlay">
      <p>
        遊戲開始後，畫面上會隨機出現音符圓圈，圈內會顯示歌詞文字。<br>
        請在音符圈縮小到定位時盡快點擊，點中即可得 1 分！<br>
        時間限制為 <strong>60 秒</strong>，時間到即結束並顯示總分。
      </p>
      <button class="game-btn" id="startBtn">開始遊戲</button>
    </div>
  </div>

  <footer>使用滑鼠或觸控點擊音符即可得分 · 純前端 HTML / CSS / JavaScript 製作</footer>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const scoreEl = document.getElementById("scoreVal");
  const comboEl = document.getElementById("comboVal");
  const timeEl = document.getElementById("timeVal");
  const lyricTicker = document.getElementById("lyricTicker");

  // 內建示範歌詞（耳熟能詳的兒歌「小星星」中文版，公共領域素材）
  const LYRIC_LINES = [
    "一閃一閃亮晶晶",
    "滿天都是小星星",
    "掛在天空放光明",
    "好像許多小眼睛",
    "一閃一閃亮晶晶",
    "滿天都是小星星"
  ];

  // 拆成單字詞池，作為音符圈上顯示的文字
  const WORD_POOL = Array.from(new Set(LYRIC_LINES.join("").split("")));

  const GAME_SECONDS = 60;
  const APPROACH_MS = 950;   // 音符圈縮小到定位所需時間
  const HIT_WINDOW_MS = 420; // 縮小到定位後，可點擊得分的寬容時間
  const MAX_TARGETS = 5;
  const BASE_RADIUS = 34;
  const SPAWN_MIN_MS = 550;
  const SPAWN_MAX_MS = 950;
  const LINE_CHANGE_MS = 9000;

  const COLORS = [
    ["#ff6fae", "#ff9ecb"],
    ["#6fd8ff", "#9ee9ff"],
    ["#ffd76f", "#ffe9a8"],
    ["#a6ff6f", "#c9ffa0"],
    ["#c88bff", "#e0bfff"]
  ];

  let state = "idle"; // idle | playing | ended
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let timeLeft = GAME_SECONDS;
  let targets = [];
  let popEffects = [];
  let nextSpawnAt = 0;
  let lineIndex = 0;
  let lastLineChangeAt = 0;
  let rafId = null;
  let countdownId = null;
  let startTime = 0;

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function resetState() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    timeLeft = GAME_SECONDS;
    targets = [];
    popEffects = [];
    lineIndex = 0;
    scoreEl.textContent = "0";
    comboEl.textContent = "0";
    timeEl.textContent = String(GAME_SECONDS);
    lyricTicker.textContent = LYRIC_LINES[0];
  }

  function spawnTarget(now) {
    const r = BASE_RADIUS;
    const margin = r + 20;
    const x = rand(margin, W - margin);
    const y = rand(margin + 20, H - margin);
    const color = pick(COLORS);
    targets.push({
      x, y, r,
      char: pick(WORD_POOL),
      color,
      spawnAt: now,
      hit: false
    });
  }

  function addPopEffect(x, y, text, color) {
    popEffects.push({ x, y, text, color, startAt: performance.now(), life: 650 });
  }

  function handleHit(target, now) {
    target.hit = true;
    score += 1;
    combo += 1;
    if (combo > maxCombo) maxCombo = combo;
    scoreEl.textContent = String(score);
    comboEl.textContent = String(combo);
    addPopEffect(target.x, target.y, "+1", target.color[0]);
  }

  function handleMiss(target) {
    combo = 0;
    comboEl.textContent = "0";
    addPopEffect(target.x, target.y, "MISS", "#888");
  }

  function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function onPointerDown(clientX, clientY) {
    if (state !== "playing") return;
    const { x, y } = pointerToCanvas(clientX, clientY);
    const now = performance.now();

    // 由最新出現的音符開始檢查，較符合直覺
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.hit) continue;
      const dx = x - t.x;
      const dy = y - t.y;
      if (Math.sqrt(dx * dx + dy * dy) <= t.r) {
        handleHit(t, now);
        return;
      }
    }
  }

  canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
  canvas.addEventListener(
    "touchstart",
    (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      if (touch) onPointerDown(touch.clientX, touch.clientY);
    },
    { passive: false }
  );

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#5a4a80";
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= W; gx += 40) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }
    for (let gy = 0; gy <= H; gy += 40) {
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTarget(t, now) {
    const elapsed = now - t.spawnAt;
    const approachProgress = Math.min(elapsed / APPROACH_MS, 1);
    const outerR = t.r + (1 - approachProgress) * t.r * 2.2;

    // 外圈（縮小指示圈）
    ctx.beginPath();
    ctx.arc(t.x, t.y, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = t.color[1];
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 本體圓圈
    const grad = ctx.createRadialGradient(t.x, t.y, 4, t.x, t.y, t.r);
    grad.addColorStop(0, t.color[1]);
    grad.addColorStop(1, t.color[0]);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.stroke();

    // 歌詞文字
    ctx.fillStyle = "#1b1030";
    ctx.font = "bold 24px 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t.char, t.x, t.y + 1);
  }

  function drawPopEffects(now) {
    popEffects = popEffects.filter((p) => now - p.startAt < p.life);
    for (const p of popEffects) {
      const t = (now - p.startAt) / p.life;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.font = "bold 20px 'Microsoft JhengHei', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y - t * 30 - 10);
      ctx.restore();
    }
  }

  function updateLyricTicker(now) {
    if (now - lastLineChangeAt >= LINE_CHANGE_MS) {
      lastLineChangeAt = now;
      lineIndex = (lineIndex + 1) % LYRIC_LINES.length;
      lyricTicker.textContent = LYRIC_LINES[lineIndex];
    }
  }

  function gameLoop(ts) {
    if (state !== "playing") return;
    const now = performance.now();

    if (now >= nextSpawnAt && targets.length < MAX_TARGETS) {
      spawnTarget(now);
      nextSpawnAt = now + rand(SPAWN_MIN_MS, SPAWN_MAX_MS);
    }

    // 移除逾時未點中的音符（記為 MISS）
    for (const t of targets) {
      if (!t.hit && now - t.spawnAt > APPROACH_MS + HIT_WINDOW_MS) {
        t.expired = true;
        handleMiss(t);
      }
    }
    targets = targets.filter((t) => !t.hit && !t.expired);

    updateLyricTicker(now);

    drawBackground();
    for (const t of targets) drawTarget(t, now);
    drawPopEffects(now);

    rafId = requestAnimationFrame(gameLoop);
  }

  function startCountdown() {
    countdownId = setInterval(() => {
      timeLeft -= 1;
      timeEl.textContent = String(Math.max(timeLeft, 0));
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function startGame() {
    resetState();
    state = "playing";
    overlay.classList.add("hidden");
    const now = performance.now();
    nextSpawnAt = now;
    lastLineChangeAt = now;
    startTime = now;
    startCountdown();
    rafId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    state = "ended";
    clearInterval(countdownId);
    if (rafId) cancelAnimationFrame(rafId);
    targets = [];
    drawBackground();

    overlay.innerHTML = `
      <p>時間到！這是你這回合的表現：</p>
      <div class="result-score">總分：${score} 分</div>
      <div class="result-combo">最高連擊：${maxCombo}</div>
      <button class="game-btn" id="restartBtn">重新開始</button>
    `;
    overlay.classList.remove("hidden");
    document.getElementById("restartBtn").addEventListener("click", startGame);
  }

  startBtn.addEventListener("click", startGame);

  // 初始畫面預覽
  drawBackground();
})();
</script>
</body>
</html>
